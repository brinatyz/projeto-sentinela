
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel Médico</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .btn-tv {
            background-color: rgb(237, 147, 243);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 8px;
        }

        .btn-tv:hover {
            background: rgb(216, 145, 214);
        }

        .btn-abrir-tv {
            background: rgb(182, 84, 189);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-abrir-tv:hover {
            background: rgb(145, 57, 153);
        }

        .consultorio-input {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            background: white;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid gray;
            flex-wrap: wrap;
        }

        .consultorio-input label {
            font-weight: bold;
        }

        .consultorio-input input {
            width: 60px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            padding: 4px 8px;
            border: 1px solid gray;
            border-radius: 4px;
        }

        .mensagem {
            margin-top: 12px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;">
            <h2 style="margin: 0;">🏥 Painel Médico</h2>

            <button
                type="button"
                class="btn-abrir-tv"
                onclick="window.open('tv.html', '_blank')">
                📺 Abrir Tela da TV
            </button>
        </div>

        <div class="consultorio-input">
            <label for="consultorio-num">Meu consultório:</label>

            <input
                type="text"
                id="consultorio-num"
                value="01"
                maxlength="4"
                aria-describedby="ajuda-consultorio">

            <span id="ajuda-consultorio">
                Este número será exibido na TV ao chamar o paciente.
            </span>
        </div>

        <h2>🩺 Pacientes na fila</h2>

        <div id="triagens">
            <p>Carregando pacientes...</p>
        </div>

        <hr>

        <h3>Consulta</h3>

        <label for="paciente">Paciente:</label>
        <input id="paciente" placeholder="Selecione um paciente" readonly>

        <label for="diagnostico">Diagnóstico:</label>
        <input id="diagnostico" placeholder="Diagnóstico">

        <label for="medicacao">Medicação:</label>
        <select id="medicacao">
            <option value="">Selecione a medicação</option>
        </select>

        <label for="obs">Observações:</label>
        <textarea id="obs" placeholder="Observações"></textarea>

        <button type="button" id="btnSalvar" onclick="salvar()">
            Salvar consulta
        </button>

        <p id="mensagem" class="mensagem" role="status"></p>

    </div>

    <script>
        let triagensCarregadas = [];

        async function carregar() {
            const div = document.getElementById("triagens");
            div.textContent = "Carregando pacientes...";

            try {
                const resposta = await fetch("/triagens");

                if (!resposta.ok) {
                    throw new Error("Não foi possível buscar as triagens.");
                }

                const data = await resposta.json();

                if (!Array.isArray(data)) {
                    throw new Error("A lista de triagens está em formato inválido.");
                }

                triagensCarregadas = data;
                div.replaceChildren();

                if (data.length === 0) {
                    div.textContent = "Nenhum paciente aguardando atendimento médico.";
                    return;
                }

                data.forEach((t, index) => {
                    const card = document.createElement("div");
                    card.className = "card";

                    const nome = document.createElement("h3");
                    nome.textContent = t.nome || "Paciente sem nome";

                    const sintoma = document.createElement("p");
                    sintoma.textContent =
                        "Sintoma: " + (t.sintoma || "Não informado");

                    const temperatura = document.createElement("p");
                    temperatura.textContent =
                        "Temperatura: " +
                        (t.temperatura ?? "Não informada") +
                        (t.temperatura != null && t.temperatura !== "" ? "°C" : "");

                    const risco = document.createElement("p");
                    const etiquetaRisco = document.createElement("span");
                    etiquetaRisco.className = String(t.risco || "não informado")
                        .toLowerCase();
                    etiquetaRisco.textContent = t.risco || "Não informado";
                    risco.append("Classificação: ", etiquetaRisco);

                    const alergia = document.createElement("p");
                    alergia.textContent =
                        "Alergia: " + (t.alergia || "Nenhuma informada");

                    const observacao = document.createElement("p");
                    observacao.textContent =
                        "Observação: " + (t.observacao || "Nenhuma");

                    const botao = document.createElement("button");
                    botao.type = "button";
                    botao.className = "btn-tv";
                    botao.textContent = "Atender";
                    botao.addEventListener("click", () => selecionar(index));

                    card.append(
                        nome,
                        sintoma,
                        temperatura,
                        risco,
                        alergia,
                        observacao,
                        botao
                    );

                    div.appendChild(card);
                });

            } catch (erro) {
                console.error("Erro ao carregar triagens:", erro);
                div.textContent =
                    "Erro ao carregar os pacientes. Verifique se o servidor está funcionando.";
            }
        }

        function selecionar(index) {
            const t = triagensCarregadas[index];

            if (!t) {
                alert("Não foi possível encontrar esse paciente.");
                return;
            }

            document.getElementById("paciente").value = t.nome || "";
            document.getElementById("obs").value = t.observacao || "";
            document.getElementById("mensagem").textContent = "";

            if (t.alergia && t.alergia.toLowerCase() !== "nenhuma") {
                alert("Atenção! Alergia informada: " + t.alergia);
            }

            document.getElementById("diagnostico").focus();
        }

        async function carregarMedicacoes() {
            const select = document.getElementById("medicacao");

            try {
                const resposta = await fetch("/lista-medicacoes");

                if (!resposta.ok) {
                    throw new Error("Não foi possível buscar as medicações.");
                }

                const data = await resposta.json();

                if (!Array.isArray(data)) {
                    throw new Error("A lista de medicações está inválida.");
                }

                select.replaceChildren();

                const primeiraOpcao = document.createElement("option");
                primeiraOpcao.value = "";
                primeiraOpcao.textContent = "Selecione a medicação";
                select.appendChild(primeiraOpcao);

                data.forEach(med => {
                    const option = document.createElement("option");
                    option.value = med;
                    option.textContent = med;
                    select.appendChild(option);
                });

            } catch (erro) {
                console.error("Erro ao carregar medicações:", erro);

                select.replaceChildren();

                const option = document.createElement("option");
                option.value = "";
                option.textContent = "Erro ao carregar medicações";
                select.appendChild(option);
            }
        }

        async function salvar() {
            const paciente = document.getElementById("paciente").value.trim();
            const diagnostico = document.getElementById("diagnostico").value.trim();
            const medicacao = document.getElementById("medicacao").value;
            const obs = document.getElementById("obs").value.trim();
            const mensagem = document.getElementById("mensagem");
            const botao = document.getElementById("btnSalvar");

            mensagem.textContent = "";

            if (!paciente) {
                alert("Selecione um paciente clicando em Atender.");
                return;
            }

            if (!diagnostico) {
                alert("Informe o diagnóstico.");
                document.getElementById("diagnostico").focus();
                return;
            }

            if (!medicacao) {
                alert("Selecione uma medicação.");
                document.getElementById("medicacao").focus();
                return;
            }

            botao.disabled = true;
            botao.textContent = "Salvando...";

            try {
                const resposta = await fetch("/consulta", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        paciente,
                        diagnostico,
                        medicacao,
                        obs
                    })
                });

                const resultado = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(
                        resultado.erro || resultado.mensagem ||
                        "Não foi possível salvar a consulta."
                    );
                }

                mensagem.textContent =
                    resultado.mensagem || "Consulta salva com sucesso!";

                document.getElementById("paciente").value = "";
                document.getElementById("diagnostico").value = "";
                document.getElementById("medicacao").value = "";
                document.getElementById("obs").value = "";

                await carregar();

            } catch (erro) {
                console.error("Erro ao salvar consulta:", erro);
                mensagem.textContent =
                    erro.message || "Erro ao salvar a consulta.";
            } finally {
                botao.disabled = false;
                botao.textContent = "Salvar consulta";
            }
        }

        carregar();
        carregarMedicacoes();
    </script>

</body>
</html>
