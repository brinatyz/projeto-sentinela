
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medicações Prescritas</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <h2>💊 Medicações Prescritas</h2>

        <div id="listaMedicacoes">
            <p>Carregando medicações...</p>
        </div>

        <button type="button" onclick="carregarMedicacoesPrescritas()">
            Atualizar lista
        </button>

    </div>

    <script>
        async function carregarMedicacoesPrescritas() {
            const div = document.getElementById("listaMedicacoes");

            div.replaceChildren();

            const carregando = document.createElement("p");
            carregando.textContent = "Carregando medicações...";
            div.appendChild(carregando);

            try {
                const resposta = await fetch("/medicacoes");

                if (!resposta.ok) {
                    throw new Error("Não foi possível buscar as medicações.");
                }

                const dados = await resposta.json();

                if (!Array.isArray(dados)) {
                    throw new Error("O servidor retornou dados inválidos.");
                }

                div.replaceChildren();

                if (dados.length === 0) {
                    const aviso = document.createElement("p");
                    aviso.textContent = "Nenhuma medicação prescrita.";
                    div.appendChild(aviso);
                    return;
                }

                dados.forEach(consulta => {
                    const card = document.createElement("div");
                    card.className = "card";

                    const paciente = document.createElement("h3");
                    paciente.textContent = consulta.paciente || "Paciente não informado";

                    const medicacao = document.createElement("p");
                    medicacao.textContent =
                        "Medicação: " + (consulta.medicacao || "Não informada");

                    const diagnostico = document.createElement("p");
                    diagnostico.textContent =
                        "Diagnóstico: " + (consulta.diagnostico || "Não informado");

                    const observacoes = document.createElement("p");
                    observacoes.textContent =
                        "Observações: " + (consulta.obs || "Nenhuma");

                    card.append(
                        paciente,
                        medicacao,
                        diagnostico,
                        observacoes
                    );

                    div.appendChild(card);
                });

            } catch (erro) {
                console.error("Erro ao carregar medicações:", erro);

                div.replaceChildren();

                const aviso = document.createElement("p");
                aviso.textContent =
                    "Erro ao carregar as medicações. Verifique se o servidor está funcionando.";

                div.appendChild(aviso);
            }
        }

        carregarMedicacoesPrescritas();
    </script>

</body>
</html>
