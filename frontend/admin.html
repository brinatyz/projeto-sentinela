<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuários</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">

        <a href="index.html"
           style="text-decoration:none; color:#3498db;
           font-size:14px; display:inline-block;
           margin-bottom:12px;">
            Voltar para o login
        </a>

        <h2>Cadastro de Usuários</h2>

        <form id="FormUsuario">
            <input type="text" id="usuario"
                   placeholder="Nome de Usuário (Login)" required>

            <input type="password" id="senha"
                   placeholder="Senha" required>

            <select id="tipo" required>
             <option value="">Selecione o setor</option>
             <option value="atendimento">Atendimento</option>
              <option value="triagem">Triagem</option>
               <option value="medico">Médico</option>
                                                   </select>
            <button type="submit">Cadastrar Usuário</button>
        </form>

        <hr style="margin:30px 0; border:none;
                   border-top:1px solid #ccc;">

        <h3>Lista de Usuários Cadastrados</h3>
        <div id="listaUsuarios"></div>

    </div>

    <script>
        // Cadastrar usuário
        document.getElementById("FormUsuario")
            .addEventListener("submit", function(e) {

            e.preventDefault();

            const usuario = document.getElementById("usuario").value.trim();
            const senha = document.getElementById("senha").value;
            const tipo = document.getElementById("tipo").value;

            fetch("/usuarios", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    usuario: usuario,
                    senha: senha,
                    tipo: tipo
                })
            })
            .then(async response => {
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || data.erro || "Não foi possível cadastrar.");
                }

                return data;
            })
            .then(data => {
                alert("Usuário cadastrado com sucesso!");

                document.getElementById("FormUsuario").reset();

                carregarUsuarios();
            })
            .catch(error => {
                console.error("Erro:", error);
                alert("Erro ao cadastrar usuário: " + error.message);
            });
        });

        // Listar usuários cadastrados
        function carregarUsuarios() {
            fetch("/usuarios")
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Erro ao buscar usuários.");
                    }

                    return response.json();
                })
                .then(usuarios => {
                    const div = document.getElementById("listaUsuarios");
                    div.innerHTML = "";

                    if (!Array.isArray(usuarios) || usuarios.length === 0) {
                        div.textContent = "Nenhum usuário cadastrado.";
                        return;
                    }

                    usuarios.forEach(u => {
                        const card = document.createElement("div");
                        card.className = "card";

                        const nome = document.createElement("b");
                        nome.textContent = "Usuário: ";

                        const setor = document.createElement("b");
                        setor.textContent = " | Setor: ";

                        card.append(
                            nome,
                            document.createTextNode(u.usuario || ""),
                            setor,
                            document.createTextNode(u.tipo || "")
                        );

                        div.appendChild(card);
                    });
                })
                .catch(error => {
                    console.error("Erro ao carregar usuários:", error);
                    document.getElementById("listaUsuarios").textContent =
                        "Não foi possível carregar os usuários.";
                });
        }

        // Carregar lista ao abrir a página
        carregarUsuarios();
    </script>
</body>
</html>
