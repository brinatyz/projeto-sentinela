
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Triagem Hospitalar</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .cabecalho-triagem {
            width: min(92%, 1000px);
            margin: 24px auto 18px;
            padding: 18px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            background: #fffaf1;
            border: 1px solid #ead5d4;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(101, 70, 63, 0.10);
        }

        .cabecalho-triagem h2 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            color: #65463f;
        }

        .btn-abrir-tv {
            padding: 11px 18px;
            background: #d99aaa;
            color: white;
            border: 1px solid #e8b9c8;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-abrir-tv:hover {
            background: #a85d75;
        }

        .pacientes-fila {
            width: min(92%, 1000px);
            margin: 0 auto 25px;
            padding: 20px;
            background: #fffaf1;
            border: 1px solid #ead5d4;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(101, 70, 63, 0.10);
        }

        .pacientes-fila h3 {
            margin-top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .pacientes-fila h3 span {
            font-size: 13px;
            font-weight: normal;
        }

        .fila-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 10px;
            padding: 14px;
            background: #fffdf9;
            border: 1px solid #ead5d4;
            border-radius: 12px;
        }

        .fila-item strong {
            color: #65463f;
        }

        .fila-item small {
            color: #8b716c;
        }

        .btn-tv {
            background: #d99aaa;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-tv:hover {
            background: #a85d75;
        }

        .btn-tv:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #resultado {
            margin: 12px 0;
            padding: 10px;
            border-radius: 8px;
        }

        #resultado:empty {
            display: none;
        }

        #resultado.vermelho {
            color: #8f1723;
            background: #f8d4d5;
        }

        #resultado.amarelo {
            color: #76520b;
            background: #fff0bd;
        }

        #resultado.verde {
            color: #285c3b;
            background: #d9edda;
        }

        .erro {
            color: #a32335;
        }

        @media (max-width: 500px) {
            .cabecalho-triagem,
            .pacientes-fila {
                width: 94%;
                padding: 16px;
            }

            .btn-abrir-tv {
                width: 100%;
            }

            .fila-item {
                align-items: flex-start;
            }

            .fila-item button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- CABEÇALHO COM BOTÃO PARA ABRIR A TV -->
    <header class="cabecalho-triagem">
        <h2>🏥 Triagem Hospitalar</h2>

        <button
            type="button"
            class="btn-abrir-tv"
            onclick="window.open('tv.html', '_blank')">
            📺 Abrir TV
        </button>
    </header>

    <!-- FILA DE PACIENTES -->
    <section class="pacientes-fila">

        <h3>
            Pacientes cadastrados no atendimento
            <span>Clique em "Chamar na TV" para chamar ao guichê.</span>
        </h3>

        <div id="fila-pacientes" aria-live="polite">
            <p>Carregando pacientes...</p>
        </div>

        <button
            type="button"
            onclick="carregarPacientes()">
            🔄 Atualizar lista
        </button>

    </section>

    <hr>

    <!-- FORMULÁRIO DE TRIAGEM -->
    <main class="container">

        <h2>🩺 Registrar Triagem</h2>

        <label for="nome">Nome do paciente:</label>
        <input id="nome" placeholder="Nome" required>

        <label for="sintoma">Sintoma principal:</label>
        <select id="sintoma" required>
            <option value="">Selecione</option>
            <option value="dor_leve">Dor leve</option>
            <option value="resfriado">Resfriado</option>
            <option value="coriza">Coriza</option>
            <option value="tosse">Tosse</option>
            <option value="febre">Febre</option>
            <option value="vomito">Vômito</option>
            <option value="diarreia">Diarreia</option>
            <option value="falta_ar_moderada">Falta de ar moderada</option>
            <option value="falta_ar_grave">Falta de ar grave</option>
            <option value="infarto">Suspeita de infarto</option>
            <option value="avc">Suspeita de AVC</option>
            <option value="convulsao">Convulsão</option>
            <option value="hemorragia">Hemorragia</option>
        </select>

        <label for="temp">Temperatura (°C):</label>
        <input
            id="temp"
            type="number"
            placeholder="Ex.: 36.5"
            min="25"
            max="45"
            step="0.1"
            required>

        <label for="alergia">Alergias:</label>
        <input id="alergia" placeholder="Alergias ou nenhuma">

        <label for="observacao">Observações:</label>
        <textarea id="observacao" placeholder="Observações"></textarea>

        <div id="resultado" role="status" aria-live="polite"></div>

        <button type="button" id="btnSalvar" onclick="salvar()">
            Salvar Triagem
        </button>

    </main>

    <script>
        function classificarRisco(sintoma, temperatura) {
            const vermelhos = [
                "infarto",
                "avc",
                "convulsao",
                "hemorragia",
                "falta_ar_grave"
            ];

            const amarelos = [
                "febre",
                "vomito",
                "diarreia",
                "falta_ar_moderada"
            ];

            if (temperatura >= 39 || vermelhos.includes(sintoma)) {
                return "vermelho";
            }

            if (temperatura >= 38 || amarelos.includes(sintoma)) {
                return "amarelo";
            }

            return "verde";
        }

        async function salvar() {
            const nome = document.getElementById("nome").value.trim();
            const sintoma = document.getElementById("sintoma").value;
            const temperaturaTexto = document.getElementById("temp").value;
            const alergia = document.getElementById("alergia").value.trim();
            const observacao = document.getElementById("observacao").value.trim();

            const resultado = document.getElementById("resultado");
            const botao = document.getElementById("btnSalvar");

            resultado.textContent = "";
            resultado.className = "";

            if (!nome || !sintoma || temperaturaTexto === "") {
                alert("Preencha o nome, o sintoma e a temperatura.");
                return;
            }

            const temperatura = Number(temperaturaTexto);

            if (!Number.isFinite(temperatura) || temperatura < 25 || temperatura > 45) {
                alert("Informe uma temperatura válida.");
                return;
            }

            const risco = classificarRisco(sintoma, temperatura);

            botao.disabled = true;
            botao.textContent = "Salvando...";

            try {
                const resposta = await fetch("/triagem", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        nome,
                        sintoma,
                        temperatura,
                        alergia: alergia || "Nenhuma",
                        observacao,
                        risco
                    })
                });

                const data = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(
                        data.erro || data.mensagem || "Não foi possível salvar a triagem."
                    );
                }

                resultado.className = risco;
                resultado.textContent =
                    "Classificação registrada: " + risco.toUpperCase();

                alert("Triagem salva com sucesso!");

                document.getElementById("nome").value = "";
                document.getElementById("sintoma").value = "";
                document.getElementById("temp").value = "";
                document.getElementById("alergia").value = "";
                document.getElementById("observacao").value = "";

                await carregarPacientes();

            } catch (erro) {
                console.error("Erro ao salvar triagem:", erro);
                resultado.className = "erro";
                resultado.textContent =
                    erro.message || "Erro ao salvar a triagem.";
            } finally {
                botao.disabled = false;
                botao.textContent = "Salvar Triagem";
            }
        }

        async function carregarPacientes() {
            const div = document.getElementById("fila-pacientes");
            div.textContent = "Carregando pacientes...";

            try {
                const resposta = await fetch("/pacientes");

                if (!resposta.ok) {
                    throw new Error("Não foi possível carregar os pacientes.");
                }

                const pacientes = await resposta.json();

                if (!Array.isArray(pacientes)) {
                    throw new Error("A lista de pacientes retornada é inválida.");
                }

                const fila = pacientes.filter(
                    paciente => paciente.status === "triagem"
                );

                div.replaceChildren();

                if (fila.length === 0) {
                    const aviso = document.createElement("p");
                    aviso.textContent = "Nenhum paciente aguardando triagem.";
                    div.appendChild(aviso);
                    return;
                }

                fila.forEach(paciente => {
                    const item = document.createElement("div");
                    item.className = "fila-item";

                    const informacoes = document.createElement("div");

                    const nome = document.createElement("strong");
                    nome.textContent = paciente.nome || "Nome não informado";

                    const detalhes = document.createElement("small");
                    detalhes.textContent =
                        "CPF: " + (paciente.cpf || "-") +
                        " | Tipo: " + (paciente.tipo || "-");

                    informacoes.append(
                        nome,
                        document.createElement("br"),
                        detalhes
                    );

                    const botao = document.createElement("button");
                    botao.type = "button";
                    botao.className = "btn-tv";
                    botao.textContent = "📺 Chamar na TV";

                    botao.addEventListener("click", () => {
                        chamarNaTV(paciente.nome, botao);
                    });

                    item.append(informacoes, botao);
                    div.appendChild(item);
                });

            } catch (erro) {
                console.error("Erro ao carregar pacientes:", erro);

                div.replaceChildren();

                const aviso = document.createElement("p");
                aviso.className = "erro";
                aviso.textContent =
                    "Erro ao carregar pacientes. Verifique se a rota /pacientes existe no servidor.";

                div.appendChild(aviso);
            }
        }

        async function chamarNaTV(nome, botao) {
            if (!nome) {
                alert("O nome do paciente não foi encontrado.");
                return;
            }

            botao.disabled = true;

            try {
                const resposta = await fetch("/tv/chamar", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        localTipo: "GUICHÊ",
                        localNumero: "01",
                        paciente: nome
                    })
                });

                const data = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(
                        data.erro || data.mensagem || "Não foi possível chamar o paciente."
                    );
                }

                alert(nome + " foi chamado na TV para o Guichê 01!");

            } catch (erro) {
                console.error("Erro ao chamar paciente:", erro);
                alert(
                    erro.message ||
                    "Erro ao chamar na TV. Verifique a rota /tv/chamar no servidor."
                );
            } finally {
                botao.disabled = false;
            }
        }

        carregarPacientes();

        // Atualiza a fila a cada 10 segundos.
        setInterval(carregarPacientes, 10000);
    </script>

</body>
</html>
